<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termos de Uso | Zyntrax</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0a0f; --surface: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08); --text: #e2e8f0; --text-muted: #94a3b8; --accent: #6366f1; }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
        header { position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; }
        .main-wrapper { max-width: 1200px; margin: 80px auto 0; display: grid; grid-template-columns: 280px 1fr; gap: 4rem; padding: 2rem; }
        aside { position: sticky; top: 100px; height: calc(100vh - 120px); overflow-y: auto; }
        .sidebar-link { display: block; padding: 8px 0; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; border-left: 2px solid transparent; padding-left: 1rem; transition: 0.3s; }
        .sidebar-link:hover, .sidebar-link.active { color: white; border-left-color: var(--accent); }
        h1 { font-size: 3rem; font-weight: 800; margin-bottom: 1rem; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-sub { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 2rem; }
        .acceptance-card { background: linear-gradient(145deg, rgba(99, 102, 241, 0.05), rgba(255,255,255,0.02)); border: 1px solid var(--accent); padding: 2rem; border-radius: 16px; margin-bottom: 4rem; }
        section { margin-bottom: 4rem; scroll-margin-top: 100px; }
        h2 { font-size: 1.75rem; margin-bottom: 1.5rem; color: white; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        p, li { color: var(--text-muted); margin-bottom: 1rem; }
        ul { padding-left: 1.5rem; margin-bottom: 1.5rem; }
        footer { border-top: 1px solid var(--border); padding: 4rem 2rem; text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 4rem; }
        @media (max-width: 900px) { .main-wrapper { grid-template-columns: 1fr; } aside { display: none; } h1 { font-size: 2rem; } }
    </style>
</head>
<body>
    <header><div class="nav-container"><div class="logo">ZYNTRAX</div><div style="font-size:0.8rem; color:var(--accent)">v1.0</div></div></header>
    <div class="main-wrapper">
        <aside id="sidebar"></aside>
        <main>
            <h1>Termos de Uso</h1>
            <p class="hero-sub">As regras que estabelecem como o Zyntrax pode ser utilizado de forma segura, responsável e transparente.</p>
            <div class="acceptance-card"><h3>Aceitação</h3><p>Ao utilizar o Zyntrax, você declara que leu e compreendeu estes Termos de Uso.</p></div>
            <div id="content-area"></div>
        </main>
    </div>
    <footer><h3>ZYNTRAX</h3><p>Fundado por Nix Founder | © 2026 Zyntrax.</p></footer>
    <script>
        const sections = ["1. Sobre o Zyntrax", "2. Aceitação dos Termos", "3. Requisitos de utilização", "4. Responsabilidade do usuário", "5. Uso proibido", "6. Sistema de tickets", "7. Economia e moeda virtual", "8. Loja e produtos", "9. Pagamentos", "10. Disponibilidade", "11. Atualizações", "12. Segurança", "13. Propriedade intelectual", "14. Serviços de terceiros", "15. Suspensão e encerramento", "16. Limitação de responsabilidade", "17. Alterações destes Termos", "18. Legislação aplicável", "19. Contato e suporte"];
        const sidebar = document.getElementById('sidebar');
        const contentArea = document.getElementById('content-area');
        sections.forEach(sec => {
            const link = document.createElement('a'); link.href = `#${sec.split('.')[0]}`; link.className = 'sidebar-link'; link.innerText = sec; sidebar.appendChild(link);
            const section = document.createElement('section'); section.id = sec.split('.')[0]; section.innerHTML = `<h2>${sec}</h2><p>Conteúdo oficial do documento Zyntrax v1.0...</p>`; contentArea.appendChild(section);
        });
    </script>
</body>
</html>
